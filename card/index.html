<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Sergio · Computer Engineer</title>
<!-- Link previews (WhatsApp, iMessage) read these statically: update with profile.json -->
<meta name="description" content="Tarjeta digital de Sergio">
<meta property="og:title" content="Sergio · Computer Engineer">
<meta property="og:description" content="Guarda mi contacto">
<meta property="og:image" content="https://sergiodep.github.io/wallet-pass/card/front.jpg">
<meta property="og:type" content="profile">
<link rel="apple-touch-icon" href="avatar.jpg">
<link rel="icon" href="avatar.jpg">
<link rel="preload" href="front.jpg" as="image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050506;
    --ink: #f2f2f5;
    --muted: #8e8e93;
    --dim: #5a5a60;
    --line: rgba(255,255,255,.09);
    --silver: linear-gradient(180deg, #f4f4f7 0%, #c9c9cf 55%, #a3a3aa 100%);
    --rx: 0deg; --ry: 0deg; --flip: 0deg;
    --sx: 50%; --sy: 30%;
    --ease-spring: cubic-bezier(.16, 1.25, .3, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--ink); min-height: 100%; }
  body {
    font-family: "Geist", -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    min-height: 100svh;
    display: flex; flex-direction: column; align-items: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  .ambient {
    position: fixed; inset: -20%; pointer-events: none; z-index: 0;
    background:
      radial-gradient(40% 30% at var(--sx) var(--sy), rgba(255,255,255,.07), transparent 70%),
      radial-gradient(60% 40% at 50% 0%, rgba(140,140,160,.10), transparent 70%);
    transition: background-position .3s;
  }
  main { position: relative; z-index: 1; width: 100%; max-width: 420px; display: flex; flex-direction: column; flex: 1; }

  header { display: flex; justify-content: space-between; align-items: center; height: 44px; opacity: 0; transition: opacity .8s .3s; }
  .eyebrow { font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .18em; color: var(--dim); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .eyebrow i { width: 6px; height: 6px; border-radius: 50%; background: #34c759; box-shadow: 0 0 10px #34c759; animation: blink 2.4s infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
  .icon-btn svg { width: 18px; height: 18px; }

  /* ---------- card ---------- */
  .stage { perspective: 1100px; display: flex; justify-content: center; padding: 34px 0 30px; touch-action: none; cursor: grab; }
  .card {
    position: relative; width: min(88vw, 392px); aspect-ratio: 85.6 / 54;
    transform-style: preserve-3d;
    transform: rotateX(var(--rx)) rotateY(calc(var(--ry) + var(--flip)));
    transition: transform .9s var(--ease-spring);
  }
  .card.live { transition: transform .12s ease-out; }
  .intro .card { transform: translateY(60px) translateZ(-520px) rotateX(64deg) rotateZ(-10deg); opacity: 0; transition: none; }
  .card.arrive { transition: transform 1.9s cubic-bezier(.22, 1, .36, 1), opacity .7s ease; }

  .face, .slice { position: absolute; inset: 0; border-radius: 4.4% / 7%; }
  .face { overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: #111 center / cover no-repeat; box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
  .face.front { background-image: url(front.jpg); transform: translateZ(2.5px); }
  .face.back { background-image: url(back.jpg); transform: rotateY(180deg) translateZ(2.5px); }
  .slice { background: linear-gradient(90deg, #3a3a40, #1c1c20 40%, #45454c); }
  .slice:nth-child(1) { transform: translateZ(1.5px); }
  .slice:nth-child(2) { transform: translateZ(.5px); }
  .slice:nth-child(3) { transform: translateZ(-.5px); }
  .slice:nth-child(4) { transform: translateZ(-1.5px); }

  .shine { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; }
  .shine::before { content: ""; position: absolute; inset: 0;
    background: radial-gradient(55% 75% at var(--sx) var(--sy), rgba(255,255,255,.20), rgba(255,255,255,.04) 45%, transparent 70%); }
  .shine::after { content: ""; position: absolute; top: -50%; bottom: -50%; width: 38%; left: -60%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.28) 50%, transparent);
    transform: skewX(-12deg); opacity: 0; }
  .sweep .shine::after { animation: sweep 1.1s cubic-bezier(.5,0,.2,1) forwards; }
  @keyframes sweep { 0% { left: -60%; opacity: 1; } 100% { left: 130%; opacity: 1; } }

  .shadow { position: absolute; left: 12%; right: 12%; bottom: -26px; height: 30px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,0,.85), transparent); filter: blur(6px);
    transform: translateX(calc(var(--ry) * -0.6)) scaleX(.92); transition: opacity .8s; }
  .intro .shadow { opacity: 0; }
  .stage-wrap { position: relative; }

  .hint { text-align: center; font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); opacity: 0; transition: opacity .8s .9s; }

  /* ---------- actions ---------- */
  .actions { margin-top: auto; padding-top: 28px; display: flex; flex-direction: column; gap: 12px; }
  .reveal { opacity: 0; transform: translateY(14px); transition: opacity .6s ease, transform .7s var(--ease-spring); }
  .ready .reveal { opacity: 1; transform: none; }
  .ready .reveal:nth-child(1) { transition-delay: .00s; }
  .ready .reveal:nth-child(2) { transition-delay: .08s; }
  .ready .reveal:nth-child(3) { transition-delay: .16s; }
  .ready header, .ready .hint { opacity: 1; }

  .primary {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    height: 56px; border-radius: 16px; text-decoration: none;
    background: var(--silver); color: #0b0b0d; font-weight: 600; font-size: 17px; letter-spacing: -.01em;
    box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 10px 30px rgba(255,255,255,.08);
  }
  .primary svg { width: 20px; height: 20px; }
  .links { display: grid; grid-template-columns: repeat(var(--n, 5), 1fr); gap: 8px; }
  .link {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
    height: 76px; border-radius: 16px; text-decoration: none; color: var(--ink);
    background: rgba(255,255,255,.035); border: 1px solid var(--line);
    font-size: 11.5px; color: var(--muted); font-weight: 500;
  }
  .link svg { width: 21px; height: 21px; color: var(--ink); }
  .secondary {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    height: 52px; border-radius: 16px; cursor: pointer; font: inherit; font-weight: 500; font-size: 16px;
    background: transparent; color: var(--ink); border: 1px solid var(--line);
  }
  .secondary svg { width: 19px; height: 19px; }
  .primary:active, .link:active, .secondary:active, .icon-btn:active { transform: scale(.97); }
  .link, .primary, .secondary { transition: transform .15s; }

  footer { text-align: center; padding-top: 18px; font-family: "Geist Mono", ui-monospace, monospace; font-size: 10.5px; letter-spacing: .12em; color: #3c3c42; text-transform: uppercase; }

  @media (prefers-reduced-motion: reduce) {
    .intro .card { transform: none; opacity: 1; }
    .reveal { transform: none; }
  }
</style>
</head>
<body class="intro">
<div class="ambient"></div>
<main>
  <header>
    <span class="eyebrow"><i></i>Tarjeta NFC</span>
    <button class="icon-btn" id="share" aria-label="Compartir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
    </button>
  </header>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <div class="card" id="card">
        <div class="slice"></div><div class="slice"></div><div class="slice"></div><div class="slice"></div>
        <div class="face front"><div class="shine"></div></div>
        <div class="face back"><div class="shine"></div></div>
      </div>
    </div>
    <div class="shadow"></div>
  </div>
  <p class="hint" id="hint">Toca para girar · Mueve el teléfono</p>

  <section class="actions">
    <a class="primary reveal" id="save" href="contact.vcf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="4"/><path d="M2.5 20a7.5 7.5 0 0 1 15 0"/><path d="M19 8v6M16 11h6"/></svg>
      Guardar contacto
    </a>
    <nav class="links reveal" id="links"></nav>
    <button class="secondary reveal" id="ar" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg>
      Ver la tarjeta en tu espacio
    </button>
  </section>
  <footer id="foot"></footer>
</main>

<a id="arLink" rel="ar" href="card.usdz" hidden><img alt="" src="avatar.jpg" width="1" height="1"></a>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement.style;
  const card = $("card"), stage = $("stage");

  const ICONS = {
    whatsapp: '<path d="M4 20l1.3-3.9A8 8 0 1 1 8 18.9z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-2.3-2.3l.8-1-1-2z" stroke-width="1.4"/>',
    phone: '<path d="M5 3h3.5l1.5 4.5-2 1.5a11 11 0 0 0 7 7l1.5-2 4.5 1.5V19a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/>',
    linkedin: '<rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8.5 7V5.5A1.5 1.5 0 0 1 10 4h4a1.5 1.5 0 0 1 1.5 1.5V7M3 12.5h18"/>',
    github: '<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/>',
    email: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5 12 13l8.5-6.5"/>'
  };
  const icon = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;

  function render(p) {
    const items = [];
    if (p.whatsapp) items.push(["whatsapp", "WhatsApp", `https://wa.me/${p.whatsapp}`]);
    if (p.phone) items.push(["phone", "Llamar", `tel:${p.phone}`]);
    if (p.linkedin) items.push(["linkedin", "LinkedIn", p.linkedin]);
    if (p.github) items.push(["github", "GitHub", p.github]);
    if (p.email) items.push(["email", "Email", `mailto:${p.email}`]);
    const nav = $("links");
    nav.style.setProperty("--n", items.length);
    nav.innerHTML = items.map(([k, label, href]) =>
      `<a class="link" href="${href}" ${/^https?:/.test(href) ? 'target="_blank" rel="noopener"' : ""}>${icon(k)}${label}</a>`).join("");
    const name = [p.firstName, p.lastName].filter(Boolean).join(" ");
    $("foot").textContent = [name, p.location].filter(Boolean).join(" · ");
    document.title = `${name} · ${p.title}`;
  }

  fetch("profile.json", { cache: "no-store" }).then((r) => r.json()).then(render).catch(() => render({
    firstName: "Sergio", title: "Computer Engineer", location: "Lima · PE",
    phone: "+51900010069", whatsapp: "51900010069", github: "https://github.com/SergioDep"
  }));

  // ---------- AR ----------
  const supportsAR = (() => { try { return document.createElement("a").relList.supports("ar"); } catch { return false; } })();
  if (supportsAR) { $("ar").hidden = false; $("ar").onclick = () => $("arLink").click(); }

  // ---------- share ----------
  $("share").onclick = async () => {
    const url = location.href.split("?")[0];
    if (navigator.share) { try { await navigator.share({ title: document.title, url }); } catch {} }
    else { try { await navigator.clipboard.writeText(url); $("share").style.borderColor = "#34c759"; } catch {} }
  };

  // ---------- tilt state ----------
  let rx = 0, ry = 0, flipped = false, dragging = false, gyro = false, idleT0 = performance.now();
  function apply() {
    root.setProperty("--rx", rx.toFixed(2) + "deg");
    root.setProperty("--ry", ry.toFixed(2) + "deg");
    root.setProperty("--sx", (50 + ry * 2.4).toFixed(1) + "%");
    root.setProperty("--sy", (35 - rx * 2.4).toFixed(1) + "%");
  }

  // idle float until the user touches or tilts
  function idle(t) {
    if (!dragging && !gyro) {
      const s = (t - idleT0) / 1000;
      rx = Math.sin(s * 0.9) * 4; ry = Math.sin(s * 0.6) * 7;
      apply();
    }
    requestAnimationFrame(idle);
  }

  // drag to tilt, tap to flip
  let sx0 = 0, sy0 = 0, moved = false;
  stage.addEventListener("pointerdown", (e) => {
    dragging = true; moved = false; sx0 = e.clientX; sy0 = e.clientY;
    card.classList.add("live"); stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - sx0, dy = e.clientY - sy0;
    if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
    ry = Math.max(-28, Math.min(28, dx / 4));
    rx = Math.max(-22, Math.min(22, -dy / 4));
    apply();
  });
  const end = () => {
    if (!dragging) return;
    dragging = false; card.classList.remove("live");
    if (!moved) {
      flipped = !flipped;
      root.setProperty("--flip", flipped ? "180deg" : "0deg");
      askGyro();
    }
    if (!gyro) { rx = 0; ry = 0; apply(); idleT0 = performance.now(); }
  };
  stage.addEventListener("pointerup", end);
  stage.addEventListener("pointercancel", end);

  // gyro (iOS needs a tap to ask; Android starts right away)
  let base = null;
  function onOrient(e) {
    if (e.beta == null || dragging) return;
    if (!base) base = { b: e.beta, g: e.gamma };
    gyro = true;
    card.classList.add("live");
    const tx = Math.max(-20, Math.min(20, -(e.beta - base.b) * 0.6));
    const ty = Math.max(-26, Math.min(26, (e.gamma - base.g) * 0.8));
    rx += (tx - rx) * 0.25; ry += (ty - ry) * 0.25;
    apply();
  }
  let asked = false;
  function askGyro() {
    if (asked) return; asked = true;
    const D = window.DeviceOrientationEvent;
    if (D && typeof D.requestPermission === "function") {
      D.requestPermission().then((s) => { if (s === "granted") addEventListener("deviceorientation", onOrient); }).catch(() => {});
    }
  }
  if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission !== "function") {
    addEventListener("deviceorientation", onOrient);
  }

  // ---------- intro ----------
  let started = false;
  function start() {
    if (started) return; started = true;
    requestAnimationFrame(() => {
      card.classList.add("arrive");
      document.body.classList.remove("intro");
      setTimeout(() => card.classList.remove("arrive"), 2000);
      setTimeout(() => card.classList.add("sweep"), 1300);
      setTimeout(() => { document.body.classList.add("ready"); requestAnimationFrame(idle); }, 1700);
    });
  }
  const img = new Image();
  img.onload = img.onerror = start;
  img.src = "front.jpg";
  setTimeout(() => { if (document.body.classList.contains("intro")) start(); }, 1500);
})();
</script>
</body>
</html>
